spring.application.name=VendasAkes

# As credenciais ficam fora do codigo-fonte. Defina estas variaveis antes de iniciar.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Adequado para desenvolvimento inicial. Em producao, prefira migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Reservadas para a etapa de integracao com o Telegram.
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
