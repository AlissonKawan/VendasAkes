spring.application.name=akes-ofertas
logging.level.it.tdlight=WARN
afiliados.tag=${AFILIADOS_TAG:telegram}
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.enabled=${TELEGRAM_ENABLED:true}
telegram.listener.enabled=${TELEGRAM_LISTENER_ENABLED:true}
telegram.listener.canal-titulo=${TELEGRAM_LISTENER_CANAL_TITULO:Afiliados e Criadores Mercado Livre}
telegram.listener.historico-limite=${TELEGRAM_LISTENER_HISTORICO_LIMITE:250}
telegram.listener.sessao-path=${TELEGRAM_LISTENER_SESSAO_PATH:.local/tdlight-session}

# Credenciais OAuth da aplicacao cadastrada no Mercado Livre.
mercadolivre.app-id=${MERCADOLIVRE_APP_ID:}
mercadolivre.client-secret=${MERCADOLIVRE_CLIENT_SECRET:}
mercadolivre.redirect-uri=${MERCADOLIVRE_REDIRECT_URI:https://droop-juncture-june.ngrok-free.dev/mercadolivre/callback}
mercadolivre.pkce-enabled=${MERCADOLIVRE_PKCE_ENABLED:true}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Persistencia PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/akes_ofertas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Publicação automática (desabilitada por padrão)
akes.scheduler.enabled=${AKES_SCHEDULER_ENABLED:false}
akes.scheduler.interval-ms=${AKES_SCHEDULER_INTERVAL_MS:300000}
akes.scheduler.min-ofertas=${AKES_SCHEDULER_MIN_OFERTAS:2}
akes.scheduler.max-ofertas=${AKES_SCHEDULER_MAX_OFERTAS:3}
akes.scheduler.delay-entre-envios-ms=${AKES_DELAY_ENTRE_ENVIOS_MS:2000}
akes.cupons.enabled=${AKES_CUPONS_ENABLED:true}
akes.cupons.cache-ttl-segundos=${AKES_CUPONS_CACHE_TTL_SEGUNDOS:900}
akes.cupons.max-paginas=${AKES_CUPONS_MAX_PAGINAS:5}
akes.cupons.max-cupons-por-ciclo=${AKES_CUPONS_MAX_CUPONS_POR_CICLO:10}
akes.cupons.max-containers-por-ciclo=${AKES_CUPONS_MAX_CONTAINERS_POR_CICLO:5}
akes.cupons.max-ofertas-diretas-por-ciclo=${AKES_CUPONS_MAX_OFERTAS_DIRETAS_POR_CICLO:20}
akes.cupons.max-candidatos-compartilhamento=${AKES_CUPONS_MAX_CANDIDATOS_COMPARTILHAMENTO:${AKES_CUPONS_MAX_CANDIDATOS_CREATE_LINK:20}}
akes.cupons.container-error-cooldown-segundos=${AKES_CUPONS_CONTAINER_ERROR_COOLDOWN_SEGUNDOS:300}
akes.cupons.max-paginas-produtos=${AKES_CUPONS_MAX_PAGINAS_PRODUTOS:4}
akes.cupons.max-produtos-por-cupom=${AKES_CUPONS_MAX_PRODUTOS_POR_CUPOM:200}
akes.cupons.timeout-ms=${AKES_CUPONS_TIMEOUT_MS:30000}
akes.cupons.max-retries=${AKES_CUPONS_MAX_RETRIES:1}
akes.cupons.retry-backoff-ms=${AKES_CUPONS_RETRY_BACKOFF_MS:500}
akes.campanhas.max-ofertas-por-ciclo=${AKES_CAMPANHAS_MAX_OFERTAS_POR_CICLO:3}
akes.campanhas.interval-ms=${AKES_CAMPANHAS_INTERVAL_MS:300000}
akes.campanhas.initial-delay-ms=${AKES_CAMPANHAS_INITIAL_DELAY_MS:300000}
akes.mercadolivre.validation.max-age-seconds=${AKES_MERCADOLIVRE_VALIDATION_MAX_AGE_SECONDS:120}
akes.ofertas.republicacao-horas=${AKES_OFERTAS_REPUBLICACAO_HORAS:48}
akes.ofertas.hub-max-paginas=${AKES_OFERTAS_HUB_MAX_PAGINAS:10}
